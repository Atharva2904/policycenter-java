# Thsi will create an in-memory H2 database for testing purposes.
# The database will be created when the application starts and will be destroyed when the application stops.
#spring.datasoruce.url=jdbc:h2:mem:testdb

# For data to survive the restarts, file-based H2 database can be used.
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# Schema update behavior
# The spring.jpa.hibernate.ddl-auto property controls the behavior of the schema generation in Hibernate. It can take the following values:
# none/validate: Hibernate will not perform any schema generation or validation. It assumes that the database schema is already in place and matches the entity mappings.
# update: Hibernate will attempt to update the database schema based on the entity mappings. It will create new tables, add columns, and modify existing tables as needed.
#         However, it will not remove any existing tables or columns.
# create-drop: Hibernate will create the database schema based on the entity mappings when the application starts and drop it when the application stops.

spring.jpa.hibernate.ddl-auto=create-drop

# By default, H2 database runs silently as daemon process.
# To see the H2 console, you need to enable it in your application.properties file.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To take a look at what's happening under the hood of JPA's abstraction layer - we can also enable SQL logging in the application.properties file.
spring.jpa.show-sql=true

# To enable Pretty-print
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.hibernate.SQL=debug
